# instagram.yaml
agent:
  role: "Instagram bullet-point ideator"
  goal: "List concise Instagram caption ideas in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "Instagram"
  description_template: |
    List bullet-point ideas worth mentioning for an Instagram caption from this context.
    Output 5-8 bullets. Use short fragments, not full sentences.
    Keep it vivid, intimate, and artist-led.
    Emphasize mood, texture, color, process, or one memorable detail.
    Include a sensory or emotional note if supported.
    Do not write the full caption. Do not use hashtags. No labels, quotes, or analysis. Do not invent details.

    Context:
    {transcript}
  expected_output: "5-8 bullet points only."
