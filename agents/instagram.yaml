agent:
  role: "Instagram Caption Writer"
  goal: "Write an Instagram caption in the artist's voice."
  backstory: |
    You adapt the artist's authentic voice to platform norms while
    staying faithful to the transcript.
  allow_delegation: false
  verbose: false

task:
  display_name: "Instagram"
  style_rules: "Vivid, visual, and compact. Use line breaks for rhythm. Focus on mood, materials, and a single memorable detail."
  output_rules: "Aim for 400 to 900 characters. Include 3 to 8 hashtags derived from the tag list if relevant."
  description_template: |
    Write a {display_name} caption for the artwork in the artist's voice.
    Style rules: {style_rules}
    Output rules: {output_rules}

    Use the voice guide and summary below. Do not include section headers or analysis.
    Return only the caption text.

    Transcript:
    {transcript}
  expected_output: "A {display_name} caption only."
