# deviantart.yaml
agent:
  role: "DeviantArt Caption Writer"
  goal: "Write a process-aware DeviantArt caption in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "DeviantArt"
  description_template: |
    Write one DeviantArt caption from this context.

    Rules:
    - 450-900 characters
    - one clean body of text
    - genuine, reflective, creator-led
    - mention medium, tools, workflow, process, or intent only if supported
    - can be slightly more process-aware than other platforms
    - do not use hashtags, emojis, bullets, labels, or analysis
    - do not invent details
    - use tags naturally only if clearly useful

    Context:
    {transcript}
  expected_output: "One caption only."
