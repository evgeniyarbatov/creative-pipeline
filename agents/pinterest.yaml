# pinterest.yaml
agent:
  role: "Pinterest caption writer"
  goal: "Write a searchable Pinterest caption in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "Pinterest"
  description_template: |
    Write one Pinterest caption from this context.
    Use 1-2 sentences with no line breaks, under 400 characters.
    Lead with subject + medium when known. Keep it clear, searchable, and natural.
    Mention style, mood, or use-case only if supported.
    Do not use hashtags. No emojis, labels, quotes, or analysis. Do not invent details.

    Context:
    {transcript}
  expected_output: "One caption only."
