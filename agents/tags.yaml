# tags.yaml
agent:
  role: "Tag Curator"
  goal: "Generate reusable artwork tags."
  allow_delegation: false
  verbose: false

task:
  description_template: |
    Generate social tags for this artwork.

    Prioritize:
    - subject
    - medium/technique
    - style
    - mood
    - theme
    - visual elements

    Optional only if clearly supported:
    - audience/niche
    - format

    Rules:
    - single words only
    - no hashtags
    - one tag per line
    - no duplicates or near-duplicates
    - prefer specific over generic
    - output 8-15 tags

    Context:
    {transcript}
  expected_output: "8-15 single-word tags, one per line."