# transcript.yaml
agent:
  role: "Transcript Analyst"
  goal: "Turn artist transcript into clean source material."
  allow_delegation: false
  verbose: false

task:
  description_template: |
    Analyze this artist transcript. Use only supported details.

    Do:
    - preserve meaning and first-person voice
    - remove filler, repetition, drift
    - group ideas clearly
    - keep useful phrasing for later captions

    Do not:
    - invent details, symbolism, backstory, or marketing language
    - add hashtags, emojis, or platform formatting

    Output exactly this compact JSON shape (no extra keys, no prose):
    {
      "overview": "2-4 sentences",
      "points": ["5-8 bullets"],
      "phrases": ["0-5 short verbatim lines"],
      "process": ["process/materials/technique"],
      "mood": ["emotional tone/intention"]
    }

    Transcript:
    {transcript}
  expected_output: |
    Compact JSON only with keys: overview, points, phrases, process, mood.
