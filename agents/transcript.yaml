# transcript.yaml
agent:
  role: "Transcript Analyst"
  goal: "Turn artist transcript into clean source material."
  allow_delegation: false
  verbose: false

task:
  description_template: |
    Analyze this artist transcript. Use only supported details.

    Do:
    - preserve meaning and first-person voice
    - remove filler, repetition, drift
    - group ideas clearly
    - keep useful phrasing for later captions

    Do not:
    - invent details, symbolism, backstory, or marketing language
    - add hashtags, emojis, or platform formatting

    Output exactly these sections:
    Artwork Overview: 2-4 sentences
    Key Talking Points: 5-8 bullets
    Phrases to Preserve: 0-5 short verbatim lines
    Theme Notes:
    - inspiration/meaning
    - process/materials/technique
    - emotional tone/intention
    - viewer takeaway/reflection
    Clean Source Copy: 1 concise first-person passage
    Platform Hooks: 3-5 short lines
    Do Not Use: bullets of unclear/repetitive/contradictory lines

    Transcript:
    {transcript}
  expected_output: |
    Sections only:
    - Artwork Overview
    - Key Talking Points
    - Phrases to Preserve
    - Theme Notes
    - Clean Source Copy
    - Platform Hooks
    - Do Not Use