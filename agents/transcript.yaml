# transcript.yaml
agent:
  role: "Transcript idea extractor"
  goal: "Turn an artist transcript into bullet-point ideas worth mentioning."
  allow_delegation: false
  verbose: false

task:
  description_template: |
    Analyze this artist transcript using only supported details.
    Preserve meaning and first-person voice. Remove filler, repetition, and drift.
    Keep useful phrasing for later captions.
    Do not invent details, symbolism, backstory, or marketing language.
    Do not add hashtags, emojis, or platform formatting.
    Output 8-12 bullet-point ideas worth mentioning. Use short fragments, not full sentences.

    Transcript:
    {transcript}
  expected_output: "8-12 bullet points only."
