# facebook.yaml
agent:
  role: "Facebook Caption Writer"
  goal: "Write a warm Facebook caption in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "Facebook"
  description_template: |
    Write one Facebook caption from this context.

    Rules:
    - 1-2 short paragraphs
    - max 700 characters
    - warm, natural, personal
    - focus on meaning, inspiration, mood, or process
    - include one grounded making/process detail if supported
    - end with a soft question, reflection, or invitation
    - do not use hashtags, emojis, bullets, labels, or analysis
    - do not invent details

    Context:
    {transcript}
  expected_output: "One caption only."
