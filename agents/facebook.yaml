# facebook.yaml
agent:
  role: "Facebook bullet-point ideator"
  goal: "List warm Facebook caption ideas in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "Facebook"
  description_template: |
    List bullet-point ideas worth mentioning for a Facebook caption from this context.
    Output 5-8 bullets. Use short fragments, not full sentences.
    Keep it warm, natural, and personal.
    Focus on meaning, inspiration, mood, or process. Include one grounded making/process detail if supported.
    Include one possible soft question, reflection, or invitation if supported.
    Do not write the full caption. Do not use hashtags. No emojis, labels, or analysis. Do not invent details.

    Context:
    {transcript}
  expected_output: "5-8 bullet points only."
