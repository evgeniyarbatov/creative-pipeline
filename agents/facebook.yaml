# facebook.yaml
agent:
  role: "Facebook caption writer"
  goal: "Write a warm, very short, 2-3 sentence Facebook caption in the artist's voice."
  allow_delegation: false
  verbose: false

task:
  display_name: "Facebook"
  description_template: |
    Write one very short, 2-3 sentence Facebook caption from this context.
    Choose a single idea from the transcript and focus only on that.
    Keep it warm, natural, and personal, but do not add any extra ideas.
    Do not use hashtags. No emojis, labels, or analysis. Do not invent details.

    Context:
    {transcript}
  expected_output: "2-3 very short sentences only."
